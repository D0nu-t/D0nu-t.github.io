<!-- ─── Page layout ──────────────────────────────────────── -->
<main id="main" class="graph-layout" data-skills-graph data-wheel-zoom>

  <!-- Left panel: controls -->
  <aside class="graph-panel">
    <div class="graph-panel-inner">

      <div class="panel-section">
        <h1 class="panel-label">Skills Graph</h1>
        <p class="panel-desc">
          My projects and the skills behind them, as a 3D graph. Left alone it tours the projects.
          Drag to turn, scroll to zoom, click a node to select it.
        </p>
      </div>

      <div class="panel-section">
        <p class="panel-label">Projects</p>
        <div class="zoom-controls">
          <button class="filter-btn" type="button" data-sg="prev" aria-label="Previous project">‹ Prev</button>
          <button class="filter-btn" type="button" data-sg="next" aria-label="Next project">Next ›</button>
        </div>
        <button class="filter-btn" type="button" data-sg="tour" aria-pressed="true">Pause tour</button>
        <p class="panel-desc panel-caption" data-sg="caption"></p>
      </div>

      <div class="panel-section">
        <label class="panel-label" for="graph-search">Find</label>
        <input class="panel-search" type="search" id="graph-search" data-sg="search" placeholder="a skill or project" autocomplete="off">
        <div class="sel-details" data-sg="details" aria-live="polite" hidden></div>
      </div>

      <div class="panel-section">
        <p class="panel-label">Show one category</p>
        <div class="filter-group">
          <button class="filter-btn" type="button" data-filter="work">
            <span class="filter-pip" style="background:#f59e0b"></span>Work
          </button>
          <button class="filter-btn" type="button" data-filter="academic">
            <span class="filter-pip" style="background:#a78bfa"></span>Academic
          </button>
          <button class="filter-btn" type="button" data-filter="lang">
            <span class="filter-pip" style="background:#5eead4"></span>Languages
          </button>
          <button class="filter-btn" type="button" data-filter="ml">
            <span class="filter-pip" style="background:#86efac"></span>ML / DL
          </button>
          <button class="filter-btn" type="button" data-filter="genai">
            <span class="filter-pip" style="background:#34d399"></span>GenAI
          </button>
          <button class="filter-btn" type="button" data-filter="infra">
            <span class="filter-pip" style="background:#6ee7b7"></span>Infrastructure
          </button>
          <button class="filter-btn" type="button" data-filter="cloud">
            <span class="filter-pip" style="background:#a7f3d0"></span>Cloud
          </button>
          <button class="filter-btn" type="button" data-filter="data">
            <span class="filter-pip" style="background:#d1fae5"></span>Data
          </button>
        </div>
      </div>

      <div class="panel-section">
        <p class="panel-label">View</p>
        <div class="zoom-controls">
          <button class="zoom-btn" type="button" data-sg="zoom-in" aria-label="Zoom in">+</button>
          <button class="zoom-btn" type="button" data-sg="zoom-out" aria-label="Zoom out">−</button>
          <button class="zoom-btn" type="button" data-sg="zoom-reset" aria-label="Reset view">↺</button>
        </div>
      </div>

      <div class="panel-section">
        <p class="panel-label">Export</p>
        <button class="filter-btn" type="button" data-copy="graph" title="Copy the graph as Markdown, ready to paste into an AI assistant">Copy graph as Markdown</button>
      </div>

    </div>
  </aside>

  <!-- The graph -->
  <div class="graph-canvas">
    <canvas data-sg="canvas" role="img" aria-label="My projects and skills as a rotating 3D graph. The Prev, Next and Find controls reach every node."></canvas>
  </div>

</main>

<script type="module" src="../src/graph-entry.ts"></script>
</body>
</html>
